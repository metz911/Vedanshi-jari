<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients | Vedanshi Jari</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/dark.css">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-body: #f3f4f6;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100%;
    }

    /* === SIDEBAR === */
    .sidebar {
      width: 260px;
      background: #1e293b;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #fff;
    }

    .sidebar a {
      color: #94a3b8;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
      transition: all 0.2s;
      display: block;
    }

    .sidebar a:hover, .sidebar a.active {
      background: #334155;
      color: #fff;
    }

    /* === CONTENT === */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }

    /* === CARDS === */
    .card {
      background: var(--bg-card);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
      padding: 1.5rem;
    }

    .card h3 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    /* === FORMS === */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 1rem;
      align-items: end;
    }

    input {
      width: 100%;
      padding: 0.625rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      font-size: 0.95rem;
      background: #f9fafb;
      box-sizing: border-box; /* Important for padding */
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.375rem;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    button:hover { background: var(--primary-hover); }

    /* === TABLE === */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }

    th {
      text-align: left;
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 1rem 0;
      border-bottom: 2px solid var(--border);
      font-weight: 600;
    }

    td {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.95rem;
    }
    
    /* Action Buttons in Table */
    .btn-action {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }
    .btn-edit { background-color: #f59e0b; color: white; }
    .btn-delete { background-color: var(--danger); color: white; }

    /* === MODAL === */
    .modal-backdrop {
      display: none; /* Hidden by default */
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(2px);
    }

    .modal-content {
      background: var(--bg-card);
      padding: 2rem;
      border-radius: 0.75rem;
      width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    
    .btn-cancel {
      background: #94a3b8;
    }
    .btn-cancel:hover { background: #64748b; }

  </style>
</head>

<body onload="protect()">

<div class="app">

  <div class="sidebar">
    <h2>Vedanshi Jari</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a class="active" href="clients.html">Clients</a>
      <a href="inventory.html">Inventory</a>
      <a href="billing.html">Billing</a>
      <a href="reports.html">Reports</a>
    </nav>
    <a href="#" id="logoutBtn" style="margin-top:auto; color:#ef4444;">Logout</a>
  </div>

  <div class="content">

    <div class="top-bar">
      <h2 class="page-title">Client Management</h2>
      <button id="themeBtn" style="background:white; color:#333; border:1px solid #ddd;">🌙 / ☀️</button>
    </div>

    <div class="card">
      <h3>Add New Client</h3>
      
      <div class="form-grid">
        <input id="clientName" placeholder="Client Name">
        <input id="clientPhone" placeholder="Phone Number">
        <input id="clientState" placeholder="State">
        
        <button id="addClientBtn">Add Client</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Registered Clients</h3>
        </div>

      <table width="100%">
        <thead>
          <tr>
            <th style="width: 30%;">Name</th>
            <th style="width: 25%;">Phone</th>
            <th style="width: 25%;">State</th>
            <th style="text-align:right; width: 20%;">Actions</th>
          </tr>
        </thead>
        <tbody id="clientsTable">
          </tbody>
      </table>
    </div>

  </div>
</div>

<div id="editModal" class="modal-backdrop">
  <div class="modal-content">
    <h3>Edit Client Details</h3>
    
    <div style="display:flex; flex-direction:column; gap:1rem;">
      <div>
        <label style="font-size:0.85rem; color:var(--text-muted);">Name</label>
        <input id="editName">
      </div>
      <div>
        <label style="font-size:0.85rem; color:var(--text-muted);">Phone</label>
        <input id="editPhone">
      </div>
      <div>
        <label style="font-size:0.85rem; color:var(--text-muted);">State</label>
        <input id="editState">
      </div>
    </div>

    <div class="modal-actions">
      <button id="cancelEditBtn" class="btn-cancel">Cancel</button>
      <button id="saveEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/clients.js"></script>

</body>
</html>
