<!DOCTYPE html>
<html>
<head>
  <title>Button Test</title>
</head>
<body>

<button id="btn">Click Me</button>
<p id="out"></p>

<script>
  document.getElementById("btn").addEventListener("click", () => {
    document.getElementById("out").innerText = "Button is working ✅";
  });
</script>

</body>
</html>
