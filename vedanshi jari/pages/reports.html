<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Vedanshi Jari</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/dark.css">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-body: #f3f4f6;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100%;
    }

    /* === SIDEBAR === */
    .sidebar {
      width: 260px;
      background: #1e293b;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #fff;
    }

    .sidebar a {
      color: #94a3b8;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
      transition: all 0.2s;
      display: block;
    }

    .sidebar a:hover, .sidebar a.active {
      background: #334155;
      color: #fff;
    }

    /* === CONTENT === */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }

    /* === CARD & TABLE === */
    .card {
      background: var(--bg-card);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
      padding: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }

    th {
      text-align: left;
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 1rem 0;
      border-bottom: 2px solid var(--border);
      font-weight: 600;
    }

    td {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.95rem;
    }
    
    /* Status Badge Style (Optional, if needed later) */
    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #d1fae5;
      color: #065f46;
    }

    /* Action Buttons */
    .btn-download {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 0.375rem;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-download:hover { background: var(--primary-hover); }

  </style>
</head>

<body onload="protect()">

<div class="app">

  <div class="sidebar">
    <h2>Vedanshi Jari</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="inventory.html">Inventory</a>
      <a href="billing.html">Billing</a>
      <a class="active" href="reports.html">Reports</a>
    </nav>
    <a href="#" id="logoutBtn" style="margin-top:auto; color:#ef4444;">Logout</a>
  </div>

  <div class="content">

    <div class="top-bar">
      <h2 class="page-title">Invoice Reports</h2>
      <button id="themeBtn" style="background:white; color:#333; border:1px solid #ddd; padding: 5px 10px; border-radius: 4px; cursor: pointer;">🌙 / ☀️</button>
    </div>

    <div class="card">
      <div style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;">
        View and download your past invoices.
      </div>

      <table width="100%">
        <thead>
          <tr>
            <th style="width: 15%;">Invoice No</th>
            <th style="width: 15%;">Date</th>
            <th style="width: 30%;">Client Name</th>
            <th style="width: 20%;">Total Amount</th>
            <th style="width: 20%; text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="reportsTable">
          </tbody>
      </table>
      
      </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/reports.js"></script>

</body>
</html>
