<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Vedanshi Jari</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/dark.css">

  <style>
    :root {
      --primary: #2563eb;
      --bg-body: #f3f4f6;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
      --warning: #f59e0b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100%;
    }

    /* === SIDEBAR === */
    .sidebar {
      width: 260px;
      background: #1e293b;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #fff;
      letter-spacing: -0.025em;
    }

    .sidebar a {
      color: #94a3b8;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
      transition: all 0.2s;
      display: block;
    }

    .sidebar a:hover, .sidebar a.active {
      background: #334155;
      color: #fff;
    }

    /* === CONTENT === */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }

    /* Theme Toggle */
    .theme-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    /* === STAT CARDS GRID === */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-sub {
      font-size: 0.875rem;
      margin-top: 0.5rem;
      color: var(--text-muted);
    }

    /* Specific Colors for Stat Highlights */
    .text-primary { color: var(--primary); }
    .text-success { color: var(--success); }

    /* === CHART CARD === */
    .chart-card {
      background: var(--bg-card);
      padding: 2rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    .chart-header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    
    .chart-header h3 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text-main);
    }

  </style>
</head>

<body onload="protect()">

<div class="app">

  <div class="sidebar">
    <h2>Vedanshi Jari</h2>
    <nav>
      <a class="active" href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="inventory.html">Inventory</a>
      <a href="billing.html">Billing</a>
      <a href="reports.html">Reports</a>
    </nav>
    <a href="#" onclick="logout()" style="margin-top:auto; color:#ef4444;">Logout</a>
  </div>

  <div class="content">

    <div class="top-bar">
      <h2 class="page-title">Dashboard</h2>
      <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️</button>
    </div>

    <div class="stats-grid">

      <div class="stat-card">
        <div class="stat-label">Total Invoices</div>
        <div class="stat-value" id="totalInvoices">0</div>
        <div class="stat-sub">Lifetime volume</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value text-success">
          ₹ <span id="totalSales">0</span>
        </div>
        <div class="stat-sub">Gross income</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Today's Date</div>
        <div class="stat-value" style="font-size: 1.5rem;" id="todayDate">
          --
        </div>
        <div class="stat-sub">Daily Overview</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Local Weather</div>
        <div class="stat-value" style="font-size: 1.5rem;" id="weather">
          Loading...
        </div>
        <div class="stat-sub">Live Update</div>
      </div>

    </div>

    <div class="chart-card">
      <div class="chart-header">
        <h3>Invoices Overview</h3>
      </div>
      <div style="position: relative; height: 300px; width: 100%;">
        <canvas id="invoiceChart"></canvas>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/dashboard.js"></script>

</body>
</html>
